name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: voice_owner
          POSTGRES_PASSWORD: voice_owner
          POSTGRES_DB: voice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voice_owner -d voice"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://voice_app:voice_app@localhost:5432/voice
      DATABASE_MIGRATION_URL: postgresql://voice_owner:voice_owner@localhost:5432/voice
      SHADOW_DATABASE_URL: postgresql://voice_owner:voice_owner@localhost:5432/voice_shadow
      TEST_DATABASE_URL: postgresql://voice_owner:voice_owner@localhost:5432/voice_test
      TEST_APP_DATABASE_URL: postgresql://voice_app:voice_app@localhost:5432/voice_test
      # CI-only throwaway key
      MASTER_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnop
      REDIS_URL: redis://localhost:6379
      EMBEDDINGS_PROVIDER: hashing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Create database roles and databases
        env:
          PGPASSWORD: voice_owner
        run: psql -h localhost -U voice_owner -d voice -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Apply migrations
        run: npm run db:migrate

      - name: Migrations match schema.prisma
        run: npm run db:check

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # High/critical advisories in production dependencies fail the build (reviewed exceptions in scripts/audit.mjs)
      - name: Dependency audit
        run: npm run audit:prod

      # Secrets committed by mistake (keys, tokens, passwords) in the whole history
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --config /repo/.gitleaks.toml

      # Alert rules parse and fire when they should
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD/infra/observability:/o" -w /o --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/infra/observability:/o" -w /o --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts.test.yml
