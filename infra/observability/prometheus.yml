# Scrapes the API and worker inside the compose network (private addresses: no token needed).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:4000"] }]
  - job_name: worker
    metrics_path: /metrics
    static_configs: [{ targets: ["worker:9464"] }]
