packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless allow-listed
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "argon2"
  - "esbuild"
  - "sharp"
  - "msgpackr-extract"
  - "@swc/core"
  - "unrs-resolver"

# One Node type definition for the whole workspace (matches .nvmrc); some packages pull newer ones
overrides:
  "@types/node": "^22.20.4"
