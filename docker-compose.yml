# Full platform in containers: Postgres (pgvector) + Redis + migrations + API + worker + web.
#
#   cp .env.example .env        # then set JWT_SECRET, MASTER_ENCRYPTION_KEY, APP_DB_PASSWORD, POSTGRES_PASSWORD
#   docker compose up -d --build
#   open http://localhost:3000
#
# For development with hot reload use infra/docker-compose.yml (databases only) + `npm run dev`.
name: voice-agent-platform

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The app connects as voice_app so Row-Level Security isolates tenants
  DATABASE_URL: postgresql://voice_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/voice
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: ${QUEUE_PREFIX:-bull}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?set MASTER_ENCRYPTION_KEY in .env}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-auto}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  # Shared by the API (uploads) and the worker (processing): see the "storage" volume
  STORAGE_LOCAL_DIR: /data/storage
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  USAGE_PRICES: ${USAGE_PRICES:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voice
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_owner -d voice"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  migrate:
    build: { context: ., target: migrate }
    image: voice-agent-platform/migrate:local
    environment:
      DATABASE_URL: postgresql://voice_owner:${POSTGRES_PASSWORD}@postgres:5432/voice
      DATABASE_MIGRATION_URL: postgresql://voice_owner:${POSTGRES_PASSWORD}@postgres:5432/voice
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., target: api }
    image: voice-agent-platform/api:local
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: 4000
      # Requests arrive through the web container's /api proxy (private Docker network)
      TRUST_PROXY: ${TRUST_PROXY:-loopback,uniquelocal}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # Plain http on localhost; set true behind HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # Platform Twilio account: buying numbers and SIP domains (optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-91}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Platform emails (invitations, password resets)
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Voice Agent Platform <no-reply@localhost>}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ADMIN_BOARD_PASSWORD: ${ADMIN_BOARD_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes: [storage:/data/storage]
    ports: ["${API_PUBLISH_PORT:-4000}:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    image: voice-agent-platform/worker:local
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      ANALYTICS_SWEEP_MINUTES: ${ANALYTICS_SWEEP_MINUTES:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      target: web
      args:
        API_INTERNAL_URL: http://api:4000
    image: voice-agent-platform/web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["${WEB_PUBLISH_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }

  # Optional: docker compose --profile observability up -d → Prometheus :9090, Grafana :3001
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    # This machine only: put them behind your own auth before exposing them
    ports: ["127.0.0.1:${PROMETHEUS_PUBLISH_PORT:-9090}:9090"]
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observability]
    environment:
      # Unset: Grafana starts with admin/admin and asks for a new password at first sign-in
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PUBLISH_PORT:-3001}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  storage:
